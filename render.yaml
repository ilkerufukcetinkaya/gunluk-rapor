services:
  - type: web
    name: gunluk-rapor
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GIZLI_ANAHTAR
        sync: false
      - key: ADMIN_EPOSTA
        sync: false
      - key: ADMIN_SIFRE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: CRON_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EPOSTA_GONDEREN
        sync: false
