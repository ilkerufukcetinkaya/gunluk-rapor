services:
  - type: web
    name: gunluk-rapor
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RAPOR_SIFRE
        sync: false
      - key: GMAIL_KULLANICI
        sync: false
      - key: GMAIL_UYGULAMA_SIFRESI
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
