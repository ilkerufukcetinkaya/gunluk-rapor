<!doctype html>
<html lang="tr">
<head>
{% include "_stil.html" %}
<title>Giriş · Günlük rapor</title>
<style>main{max-width:420px; padding-top:12vh}</style>
</head>
<body>
<main>
  <h1>Günlük rapor</h1>
  <p class="hint">Hesabınızla giriş yapın. Hesabı yönetici açar.</p>
  {% if hata %}<p class="warn" role="alert">{{ hata }}</p>{% endif %}
  <form class="form" method="post" action="/giris">
    <label for="eposta">E-posta</label>
    <input type="email" id="eposta" name="eposta" value="{{ eposta }}" autocomplete="username" required autofocus>
    <label for="sifre">Şifre</label>
    <input type="password" id="sifre" name="sifre" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" name="hatirla" value="1"> Beni hatırla (30 gün)</label>
    <div class="actions"><button class="primary" type="submit">Giriş yap</button></div>
  </form>
</main>
</body>
</html>
