<!doctype html>
<html lang="tr">
<head>
{% include "_stil.html" %}
{% import "_ikon.html" as i %}
<title>Giriş · Günlük rapor</title>
<style>
body{min-height:100vh; background:var(--bg) linear-gradient(var(--dark), var(--dark)) top / 100% 300px no-repeat}
main{max-width:420px; padding:calc(48px + env(safe-area-inset-top)) 16px 40px; gap:26px}
.marka{justify-content:center; font-size:18px}
.marka i{width:36px; height:36px; border-radius:10px}
.giris{padding:22px 20px; display:flex; flex-direction:column; gap:14px}
.giris h1{font-size:26px; letter-spacing:-.02em}
.giris .form{display:flex; flex-direction:column; gap:8px}
.giris .form label.alan{margin-top:6px}
.giris .check{margin:8px 0 6px}
.giris .check input{width:20px; height:20px; accent-color:var(--accent)}
.giris button.primary{width:100%}
</style>
</head>
<body>
<main>
  <div class="marka"><i>{{ i.ikon('tik', 19, 2.6) }}</i>Rapor</div>
  <section class="card giris">
    <div><h1>Günlük rapor</h1><p class="hint" style="margin-top:4px">Hesabınızla giriş yapın. Hesabı yönetici açar.</p></div>
    {% if hata %}<p class="uyari" role="alert">{{ hata }}</p>{% endif %}
    <form class="form" method="post" action="/giris">
      <label class="alan" for="eposta">E-posta</label>
      <input type="email" id="eposta" name="eposta" value="{{ eposta }}" autocomplete="username" required autofocus>
      <label class="alan" for="sifre">Şifre</label>
      <input type="password" id="sifre" name="sifre" autocomplete="current-password" required>
      <label class="check"><input type="checkbox" name="hatirla" value="1"> Beni hatırla (30 gün)</label>
      <button class="primary" type="submit">Giriş yap</button>
    </form>
  </section>
</main>
</body>
</html>
